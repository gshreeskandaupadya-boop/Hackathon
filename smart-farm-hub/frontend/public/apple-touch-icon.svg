<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- Green background -->
  <rect width="180" height="180" fill="#16a34a"/>
  
  <!-- Plant/leaf symbol -->
  <g transform="translate(90.0, 90.0)">
    <!-- Leaf 1 (left) -->
    <ellipse cx="-27.0" cy="-18.0" rx="21.599999999999998" ry="36.0" fill="#22c55e" transform="rotate(-30)"/>
    
    <!-- Leaf 2 (right) -->
    <ellipse cx="27.0" cy="-18.0" rx="21.599999999999998" ry="36.0" fill="#86efac" transform="rotate(30)"/>
    
    <!-- Center stem -->
    <rect x="-5.3999999999999995" y="-45.0" width="10.799999999999999" height="62.99999999999999" fill="#22c55e" rx="5.3999999999999995"/>
    
    <!-- Bottom leaf -->
    <ellipse cy="27.0" rx="36.0" ry="27.0" fill="#16a34a"/>
  </g>
</svg>